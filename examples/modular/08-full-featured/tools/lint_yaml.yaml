name: lint_yaml
type: cli
description: Lint YAML files for syntax errors
command: "sh -c 'yamllint \"{{path}}\"'"
parameters:
  path:
    type: string
    description: YAML file to lint
    required: true
sandbox:
  type: docker
  image: cytopia/yamllint
  mount_workdir: true
  network_isolated: true
  resource_limits:
    cpu_limit: "500m"
    memory_limit: "256Mi"
    timeout_sec: 10
