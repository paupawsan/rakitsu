# Interim CI: Go build/vet/test only. Frontend and packaging steps will be
# added once those parts of the tree land in later ports.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...
