name: "Test - Multi Agent with Reflection"
version: "1.0.0"
description: "Tests reflection with orchestrator and worker agents"

settings:
  default_provider: "openai"
  api_keys:
    openai: "${OPENAI_API_KEY}"
  defaults:
    model: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 4096


tools:
  - name: "list_files"
    type: "cli"
    description: "List files and directories"
    command: "ls -la"
    sandbox:
      type: "local_restricted"
      allowed_paths:
        - "/workspace"
      resource_limits:
        timeout_sec: 10

  - name: "read_file"
    type: "fs"
    description: "Read contents of a file"
    operation: "read"
    allowed_paths:
      - "/workspace"

  - name: "search_files"
    type: "fs"
    description: "Search for content in files"
    operation: "search"
    allowed_paths:
      - "/workspace"

agents:
  - name: "Code Reviewer"
    role: "worker"
    model: "gpt-4o-mini"
    system_prompt: |
      You are a code review expert. Read source files and provide quality
      assessments including: code structure, potential bugs, and improvements.
    tools:
      - "read_file"
      - "search_files"
    settings:
      max_iterations: 5
      reflection:
        enabled: true
        mode: "after_tool"
      ground_check:
        enabled: true
        confidence_threshold: 0.7

  - name: "Structure Explorer"
    role: "worker"
    model: "gpt-4o-mini"
    system_prompt: |
      You are a project structure analyst. Explore directory trees and
      summarize project layout, technologies used, and organization patterns.
    tools:
      - "list_files"
      - "read_file"
    settings:
      max_iterations: 5
      reflection:
        enabled: true
        mode: "after_tool"

orchestrator:
  name: "Supervisor"
  strategy: "ReAct"
  model: "gpt-4o-mini"
  system_prompt: |
    You are the Supervisor coordinating specialist agents.

    Available specialists:
    - Code Reviewer: Reviews source code quality
    - Structure Explorer: Analyzes project structure

    Break down the user's request, delegate to specialists, and synthesize results.
  agents:
    - "Code Reviewer"
    - "Structure Explorer"
  routing:
    auto_delegate_tools: true
  handoff:
    include_context: true
    max_context_length: 4000
